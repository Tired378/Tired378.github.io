<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>{{ page.title }} | {{ site.title }}</title>
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <meta name="description" content="{{ site.description }}">
  <link rel="stylesheet" href="{{ '/assets/css/style.css' | relative_url }}">
  <style>
    .site-nav { margin: 1rem 0; display:flex; gap:.5rem; flex-wrap:wrap; }
    .site-nav .btn { text-decoration:none; padding:.4rem .8rem; border:1px solid #fff2; border-radius:4px; }
    .site-nav .btn-current { background:#fff2; }
  </style>
</head>
<body>
  <header class="page-header" role="banner">
    <h1 class="project-name">{{ site.title }}</h1>
    <h2 class="project-tagline">{{ site.description }}</h2>
    {% include nav.html %}
  </header>
  <main id="content" class="main-content" role="main">
    {{ content }}
    <footer class="site-footer">
      <span class="site-footer-owner">{{ site.title }}</span>
    </footer>
  </main>
</body>
</html>
